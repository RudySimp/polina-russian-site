services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: polina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:env first}
      POSTGRES_DB: polina
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - polina-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polina -d polina"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  polina-postgres:
